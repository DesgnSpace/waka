apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: waka
type: Opaque
stringData:
  POSTGRES_DB: waka
  POSTGRES_USER: waka
  POSTGRES_PASSWORD: replace-with-a-strong-database-password
  # Connection string for the app
  DATABASE_URL: postgresql://waka:replace-with-a-strong-database-password@postgres-service.waka.svc.cluster.local:5432/waka?sslmode=disable
